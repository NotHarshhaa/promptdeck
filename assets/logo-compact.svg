<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PromptDeck">
  <title>PromptDeck</title>
  <defs>
    <linearGradient id="pdTileCompact" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED" />
      <stop offset="0.55" stop-color="#A21CAF" />
      <stop offset="1" stop-color="#DB2777" />
    </linearGradient>
  </defs>

  <!-- simplified lockup: legible down to 16px -->
  <rect width="512" height="512" rx="96" fill="url(#pdTileCompact)" />
  <rect x="96" y="136" width="320" height="240" rx="36" fill="#FFFFFF" />
  <g fill="none" stroke="#3B0764" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="184,204 240,256 184,308" />
    <line x1="276" y1="308" x2="328" y2="308" />
  </g>
</svg>
